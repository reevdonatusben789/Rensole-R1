<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Rensole R1</title>
<style>
@font-face{font-family:Orbitron;src:url(fonts/Orbitron.ttf);font-weight:400 900}
@font-face{font-family:Rajdhani;src:url(fonts/Rajdhani-Medium.ttf);font-weight:500}
@font-face{font-family:Rajdhani;src:url(fonts/Rajdhani-Bold.ttf);font-weight:700}
:root{--void:#080814;--panel:#12122a;--line:#2b2b5c;--text:#e9ecff;--dim:#8087b8;--ac:#14e6ff;--hot:#ff2d95}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--void);color:var(--text);font:500 1.35rem Rajdhani,sans-serif;cursor:none}
#auth,#auth *{cursor:auto}
#title,.wm{font-family:Orbitron,sans-serif}
.wm{display:flex;align-items:center;gap:.9em;font-weight:500;letter-spacing:.34em;color:#fff}.wm i{font-style:normal;font-weight:800;font-size:.5em;letter-spacing:.12em;padding:.3em .7em .3em .8em;background:var(--ac);color:#06061a;clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,0 100%)}
body.mouse{cursor:auto}
#bg{position:fixed;inset:-6%;background-size:cover;background-position:center top;filter:blur(30px) brightness(.45) saturate(1.3);transition:background .4s}
#grid{position:fixed;inset:0;background:linear-gradient(180deg,rgba(8,8,20,.1),var(--void) 85%),repeating-linear-gradient(0deg,rgba(20,230,255,.05) 0 1px,transparent 1px 48px),repeating-linear-gradient(90deg,rgba(255,45,149,.04) 0 1px,transparent 1px 48px)}
#scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);z-index:50}
header{position:fixed;top:3.5vh;left:5vw;right:5vw;display:flex;justify-content:space-between;align-items:center}
.logo .wm{font-size:1.6rem}
.logo small{display:block;font-size:.95rem;color:var(--dim);letter-spacing:.12em;margin-top:.1rem}
#tabs{display:flex;gap:1rem;align-items:center}
#tabs span{padding:.5rem 1.6rem;font-family:Orbitron;font-size:1rem;letter-spacing:.14em;color:var(--dim);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:.2s}
#tabs span.on{background:var(--ac);color:#06061a;font-weight:700}
.status{display:flex;gap:1.6rem;color:var(--dim)}#pad.on{color:var(--ac)}
#track{position:fixed;top:23vh;left:0;display:flex;gap:2vw;align-items:flex-start;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.tile{flex:none;width:14vw;transform:scale(.88);opacity:.6;transition:.22s;filter:none}
.tile.wide{width:22vw}
.tile.on{transform:scale(1);opacity:1;filter:drop-shadow(0 0 16px var(--ac))}
.face{position:relative;aspect-ratio:2/3;overflow:hidden;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.wide .face{aspect-ratio:16/10}
.face::after{content:"";position:absolute;inset:0;border:3px solid transparent}
.on .face::after{border-color:var(--ac)}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ini{position:absolute;inset:0;display:grid;place-items:center;font:900 3vw Orbitron;opacity:.85;text-align:center;padding:1rem}
.wide .ini{font-size:1.7vw}
.face.add{background:var(--panel)}.face.add span{position:absolute;inset:0;display:grid;place-items:center;font-size:4vw;color:var(--dim)}
.tile.go{animation:go .55s ease-out}@keyframes go{50%{transform:scale(1.1)}}
#info{position:fixed;left:5vw;bottom:16vh;max-width:62vw}
#title{font-size:3.2vw;font-weight:800;letter-spacing:.04em;text-shadow:0 4px 30px #000}
#meta{margin-top:.6rem;font-size:1.5rem;color:var(--dim)}
#hints{position:fixed;left:5vw;bottom:4vh;display:flex;gap:2.2vw;color:var(--dim)}
#hints span{display:flex;align-items:center;gap:.6rem}#hints [hidden]{display:none}
.k{min-width:2rem;height:2rem;padding:0 .4rem;border-radius:50%;display:grid;place-items:center;font:700 1rem Orbitron;color:#06061a}
.k.a{background:#46c26a}.k.b{background:#e5584d}.k.x{background:#4b8cf5}.k.y{background:#f2c230}.k.m{background:#cfd5f5;border-radius:7px;font-size:.75rem}
#welcome{position:fixed;top:14vh;left:50%;translate:-50% -20px;opacity:0;text-align:center;transition:.6s;pointer-events:none}
#welcome.on{opacity:1;translate:-50% 0}
#welcome h2{font:800 2.2rem Orbitron;letter-spacing:.08em;text-shadow:0 0 22px var(--hot)}#welcome p{color:var(--dim);margin-top:.3rem}
#toast{position:fixed;top:12vh;left:50%;translate:-50% 0;background:var(--panel);border:1px solid var(--ac);padding:.6rem 1.6rem;opacity:0;transition:.25s}#toast.on{opacity:1}
#sheet{position:fixed;inset:0;background:rgba(4,4,12,.75);display:none;place-items:center;z-index:20}#sheet.on{display:grid}
#menu{width:min(30rem,80vw);background:var(--panel);border:1px solid var(--line);padding:.8rem;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
#menu div{padding:.9rem 1.3rem;font-size:1.5rem}#menu div.on{background:var(--ac);color:#06061a;font-weight:700}
#flash{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff 0,var(--ac) 25%,transparent 60%);scale:.2}
#flash.on{animation:fl .65s ease-out}@keyframes fl{0%{opacity:.9;scale:.2}100%{opacity:0;scale:3.2}}
#boot{position:fixed;inset:0;z-index:100;background:#05050f;display:grid;place-items:center;text-align:center;transition:opacity .7s}#boot.off{opacity:0;pointer-events:none}
#boot .wm{font-size:4.4vw;justify-content:center;animation:rise 1.4s ease-out both}
@keyframes rise{from{opacity:0;letter-spacing:.7em}}
#boot p{margin-top:1rem;font-size:1.4rem;letter-spacing:.3em;color:var(--dim);animation:rise 1.4s .5s ease-out both}
.bar{width:22vw;height:3px;background:var(--line);margin:3rem auto 0}.bar i{display:block;height:100%;background:var(--ac);box-shadow:0 0 12px var(--ac);animation:ld 3s ease-in-out both}@keyframes ld{from{width:0}}
#auth{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(8,8,20,.88)}#auth.on{display:grid}
#box{width:min(48rem,94vw);background:var(--panel);border:1px solid var(--line);padding:2rem;display:grid;gap:.9rem;clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,0 100%)}
#box h2{font:800 1.4rem Orbitron;letter-spacing:.1em}
#box input{background:#0a0a1e;border:1px solid var(--line);color:var(--text);padding:.8rem 1rem;font:inherit}#box input:focus{outline:none;border-color:var(--ac)}
#box button{padding:.8rem;border:0;font:700 1.1rem Orbitron;letter-spacing:.1em;background:var(--ac);color:#06061a}
#box a{color:var(--dim);text-align:center;text-decoration:underline}#err{color:var(--hot);min-height:1.3rem}
#osk{display:grid;gap:.4rem}.kr{display:flex;gap:.4rem;justify-content:center}
.ok{min-width:3rem;height:3rem;padding:0 .8rem;display:grid;place-items:center;background:#0a0a1e;border:1px solid var(--line);font-size:1.3rem;user-select:none}
.ok.wd{flex:1;font:700 1rem Orbitron;letter-spacing:.06em}.ok.on{background:var(--ac);color:#06061a;border-color:var(--ac)}
#box input.cur{border-color:var(--ac)}
#oh{display:flex;gap:1.4rem;justify-content:center;color:var(--dim);font-size:1rem}#oh span{display:flex;gap:.4rem;align-items:center}
#kb{position:fixed;right:5vw;bottom:4vh;color:var(--dim);font-size:1.05rem}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}

/* ---- tvOS-style look: soft, rounded, frosted, no neon or scanlines ---- */
:root{--void:#0d0d12;--panel:rgba(48,48,58,.78);--line:rgba(255,255,255,.12);--text:#f5f5f7;--dim:rgba(245,245,247,.6)}
html *{font-family:-apple-system,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif!important}
html,body{font-weight:500;background:var(--void)}
#grid{background:radial-gradient(120% 80% at 50% 0,rgba(255,255,255,.05),transparent 60%),linear-gradient(180deg,rgba(10,10,16,.2),rgba(10,10,16,.92) 88%)}
#scan{display:none}
#bg{inset:-10%;filter:blur(64px) brightness(.55) saturate(1.5)}
html .wm{font-weight:600;letter-spacing:.01em;gap:.6em}
html .wm i{clip-path:none;border-radius:99px;background:rgba(255,255,255,.2);color:#fff;font-weight:600;letter-spacing:.02em;padding:.25em .75em}
.logo small{letter-spacing:.02em}
#tabs{background:rgba(255,255,255,.1);backdrop-filter:blur(24px);border-radius:99px;padding:.3rem;gap:.2rem}
#tabs span{clip-path:none;border-radius:99px;padding:.45rem 1.6rem;font-size:1.05rem;font-weight:600;letter-spacing:.01em}
#tabs span.on{background:#f5f5f7;color:#111}
.tile{opacity:.75;transform:scale(.94);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s}
.tile.on{opacity:1;transform:scale(1.08);filter:none}
.face{clip-path:none;border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,.35);transition:box-shadow .35s}
.tile.on .face{box-shadow:0 34px 70px rgba(0,0,0,.6),0 0 0 3px rgba(255,255,255,.85)}
.on .face::after{border-color:transparent;border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,.22),transparent 45%)}
.face.add{background:rgba(255,255,255,.1)}
#title{font-size:3.2vw;font-weight:700;letter-spacing:-.01em;text-shadow:0 2px 24px rgba(0,0,0,.5)}
.k.a,.k.b,.k.x,.k.y,.k.m{background:rgba(255,255,255,.22);color:#fff}
#welcome h2{font-weight:700;letter-spacing:-.01em;text-shadow:none}
#toast{background:var(--panel);backdrop-filter:blur(24px);border:0;border-radius:99px}
#sheet{background:rgba(10,10,16,.55);backdrop-filter:blur(30px)}
#menu{clip-path:none;border:0;border-radius:28px;backdrop-filter:blur(30px);padding:.9rem}
#menu div{border-radius:14px}#menu div.on{background:#f5f5f7;color:#111}
#flash{background:radial-gradient(circle,rgba(255,255,255,.85) 0,transparent 60%)}
#boot{background:var(--void)}.bar{height:4px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.15)}.bar i{background:#fff;box-shadow:none}
@keyframes rise{from{opacity:0;transform:scale(.96)}}
#auth{background:rgba(10,10,16,.6);backdrop-filter:blur(30px)}
#box{clip-path:none;border:0;border-radius:30px;backdrop-filter:blur(30px)}
#box input{background:rgba(255,255,255,.08);border:1px solid transparent;border-radius:14px}#box input:focus,#box input.cur{border-color:rgba(255,255,255,.7)}
#box button{border-radius:99px;background:#f5f5f7;color:#111;letter-spacing:0}
.ok{background:rgba(255,255,255,.08);border:0;border-radius:12px}.ok.on{background:#f5f5f7;color:#111}
.mk{height:1.5em;width:auto;flex:none;overflow:visible}html .wm{gap:.55em}
</style></head><body>
<div id="bg"></div><div id="grid"></div><div id="scan"></div>
<header>
 <div class="logo"><div class="wm"><svg class="mk" viewBox="0 0 70 64" fill="none" stroke-linejoin="miter"><path d="M47 22 L60 9 V58" style="stroke:var(--ac)" stroke-width="10"/><g stroke="#0d0d12" stroke-opacity=".6" stroke-width="15"><path d="M12 8 V58"/><path d="M12 12 H32 a14 14 0 0 1 0 28 H12"/><path d="M30 41 L48 58"/></g><g stroke="#fff" stroke-width="9"><path d="M12 8 V58"/><path d="M12 12 H32 a14 14 0 0 1 0 28 H12"/><path d="M30 41 L48 58"/></g></svg><span>RENSOLE</span></div><small>a Reev D.B studios</small></div>
 <div id="tabs"><b class="k m">LB</b><span data-t="games">GAMES</span><span data-t="tv">SMART TV</span><b class="k m">RB</b></div>
 <div class="status"><span id="pad">Controller</span><span id="who"></span><span id="clock"></span></div>
</header>
<div id="track"></div>
<div id="welcome"><h2 id="wh"></h2><p id="wp"></p></div>
<div id="info"><div id="title"></div><div id="meta"></div></div>
<div id="hints">
 <span><b class="k a">A</b><em id="hA">Play</em></span>
 <span id="hX" hidden><b class="k x">X</b>Remove</span>
 <span id="hY"><b class="k y">Y</b>Add game</span>
 <span id="hMenu"><b class="k m">≡</b>Menu</span>
</div>
<div id="kb">Keyboard: arrows or WASD move, Enter select, Tab switch tab, M menu</div>
<div id="toast"></div><div id="flash"></div>
<div id="sheet"><div id="menu"></div></div>
<div id="auth"><div id="box">
 <h2 id="at">SIGN IN</h2>
 <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password">
 <div id="err"></div><div id="osk"></div>
 <div id="oh"><span><b class="k a">A</b>Type</span><span><b class="k x">X</b>Delete</span><span><b class="k y">Y</b>Space</span><span><b class="k b">B</b>Switch field</span><span><b class="k m">≡</b>Sign in</span></div>
</div></div>
<div id="boot"><div><div class="wm"><svg class="mk" viewBox="0 0 70 64" fill="none" stroke-linejoin="miter"><path d="M47 22 L60 9 V58" style="stroke:var(--ac)" stroke-width="10"/><g stroke="#0d0d12" stroke-opacity=".6" stroke-width="15"><path d="M12 8 V58"/><path d="M12 12 H32 a14 14 0 0 1 0 28 H12"/><path d="M30 41 L48 58"/></g><g stroke="#fff" stroke-width="9"><path d="M12 8 V58"/><path d="M12 12 H32 a14 14 0 0 1 0 28 H12"/><path d="M30 41 L48 58"/></g></svg><span>RENSOLE</span></div><p>a Reev D.B studios</p><div class="bar"><i></i></div></div></div>
<script>
const $ = s => document.querySelector(s), el = (t, c) => Object.assign(document.createElement(t), { className: c || '' });
const sleep = ms => new Promise(r => setTimeout(r, ms));
const S = Object.assign({ sound: true, accent: 0 }, JSON.parse(localStorage.getItem('r1') || '{}'));
const ACC = [['Cyan', '#14e6ff'], ['Magenta', '#ff2d95'], ['Amber', '#fcee0a']];
const keep = () => localStorage.setItem('r1', JSON.stringify(S));
const paint = () => document.documentElement.style.setProperty('--ac', ACC[S.accent][1]);

// ---- sound (all synthesised, no files) ----
const AC = new AudioContext();
function tone(f, t0, d, o = {}) {
  const { type = 'sine', g = .07, f2, lp = 4000 } = o, t = AC.currentTime + t0;
  const n = AC.createOscillator(), v = AC.createGain(), l = AC.createBiquadFilter();
  n.type = type; n.frequency.setValueAtTime(f, t); if (f2) n.frequency.exponentialRampToValueAtTime(f2, t + d);
  l.type = 'lowpass'; l.frequency.value = lp;
  v.gain.setValueAtTime(.0001, t); v.gain.exponentialRampToValueAtTime(g, t + .015); v.gain.exponentialRampToValueAtTime(.0001, t + d);
  n.connect(l).connect(v).connect(AC.destination); n.start(t); n.stop(t + d + .05);
}
const sfx = {
  move() { tone(640 + Math.random() * 60, 0, .09, { type: 'triangle', g: .045, lp: 2400 }); },
  ok() { tone(523, 0, .12); tone(784, .07, .22); },
  back() { tone(440, 0, .1, { type: 'triangle' }); tone(330, .06, .15, { type: 'triangle' }); },
  tab() { tone(260, 0, .22, { type: 'sawtooth', g: .03, f2: 1000, lp: 1800 }); },
  welcome() { tone(880, 0, .25, { g: .05 }); tone(1318, .12, .6, { g: .05 }); },
  launch() { tone(90, 0, .9, { type: 'sawtooth', g: .05, f2: 900, lp: 2200 }); [523, 659, 784, 1046].forEach((f, i) => tone(f, .15 + i * .07, .9, { g: .05 })); },
  boot() { [196, 294, 392, 588].forEach((f, i) => tone(f, i * .2, 1.8, { g: .06, lp: 1800 })); tone(55, 0, 2.6, { type: 'sawtooth', g: .06, f2: 110, lp: 300 }); tone(1176, 1, 1.4, { g: .035 }); },
};
const play = n => { if (S.sound) { AC.resume(); sfx[n](); } };

// ---- state ----
const TVFALLBACK = [];
let me = null, tab = 'games', idx = { games: 0, tv: 0 }, games = [], tvApps = TVFALLBACK;
let sheetOn = false, sel = 0, locked = true, authOn = false, createMode = false;
const items = () => tab === 'games' ? [...games, { add: true }] : tvApps;
const grad = n => { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 360; return `linear-gradient(160deg,hsl(${h} 65% 36%),hsl(${(h + 60) % 360} 70% 12%))`; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

async function load() { games = await api.list(); tvApps = await api.tvList(); render(); }
function render() {
  $('#tabs').querySelectorAll('span').forEach(s => s.classList.toggle('on', s.dataset.t === tab));
  $('#hY').hidden = tab !== 'games';
  $('#track').replaceChildren(...items().map(g => {
    const t = el('div', 'tile' + (tab === 'tv' ? ' wide' : '')), f = el('div', 'face'); t.append(f);
    if (g.add) { f.classList.add('add'); f.innerHTML = '<span>+</span>'; return t; }
    f.style.background = g.color ? `linear-gradient(145deg,${g.color},#0a0a1e 95%)` : grad(g.name);
    const s = el('span', 'ini'); s.textContent = g.color ? g.name.toUpperCase() : g.name.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase(); f.append(s);
    if (g.art) { const im = new Image(); im.onload = () => f.append(im); im.src = g.art; }
    return t;
  }));
  focus(Math.min(idx[tab], items().length - 1), true);
}
function focus(i, quiet) {
  idx[tab] = i; localStorage.setItem('r1resume', JSON.stringify({ tab, idx })); const tiles = [...$('#track').children], g = items()[i];
  tiles.forEach((t, n) => t.classList.toggle('on', n === i));
  $('#track').style.transform = `translateX(${innerWidth * .05 - tiles[i].offsetLeft}px)`;
  $('#title').textContent = g.add ? 'Add a game' : g.name;
  $('#meta').textContent = g.add ? (games.length ? 'Pick any .exe, shortcut or .bat file' : 'No games found yet. Press A to add one.') : tab === 'tv' ? (g.drm ? 'Opens full screen in Edge' : 'Opens inside Rensole R1') : g.source;
  $('#hA').textContent = g.add ? 'Choose file' : tab === 'tv' ? 'Watch' : 'Play';
  $('#hX').hidden = !g.custom;
  $('#bg').style.background = g.add ? 'none' : g.color ? `linear-gradient(145deg,${g.color},#0a0a1e)` : `url("${g.hero || g.art || ''}") center top/cover, ${grad(g.name)}`;
  if (!quiet) play('move');
}
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); }
function flash() { const f = $('#flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
const rumble = () => [...navigator.getGamepads()].find(Boolean)?.vibrationActuator?.playEffect('dual-rumble', { duration: 200, strongMagnitude: .5, weakMagnitude: .5 });

async function go() {
  const g = items()[idx[tab]];
  if (g.add) { play('ok'); if (await api.add()) load(); return; }
  play('launch'); flash(); rumble(); locked = true; $('#track').children[idx[tab]].classList.add('go');
  if (tab === 'tv') { if (g.drm) toast('Opening in Edge. Stick = mouse, A = click, Y = keyboard, hold B = back to Rensole'); await sleep(650); const r = await api.tvOpen(g.id, false); if (r === 'edge') { await sleep(1500); locked = false; } else tvOpen = true; }
  else { toast('Starting ' + g.name); api.launch(g.id); setTimeout(() => { locked = false; load(); }, 1500); }
}
let tvOpen = false, mute = 0;
api.onTvClosed(() => { tvOpen = false; locked = false; mute = performance.now() + 450; window.focus(); play('back'); });
addEventListener('focus', () => { if (tvOpen) { tvOpen = false; locked = false; mute = performance.now() + 450; } });

const MENU = () => [['Back to Rensole', 'close'], ['Sound: ' + (S.sound ? 'On' : 'Off'), 'snd'], ['Accent: ' + ACC[S.accent][0], 'acc'], [me?.guest ? 'Sign in' : 'Sign out', 'out'], ['Sleep', 'sleep'], ['Restart', 'restart'], ['Shut down', 'shutdown'], ['Quit', 'quit']];
function drawMenu() { $('#menu').replaceChildren(...MENU().map(([l], n) => { const d = el('div', n === sel ? 'on' : ''); d.textContent = l; return d; })); }
function openSheet(on) { sheetOn = on; sel = 0; $('#sheet').classList.toggle('on', on); if (on) drawMenu(); play(on ? 'ok' : 'back'); }

async function act(a) {
  if (performance.now() < mute) return; if (authOn) return authAct(a); if (locked) return;
  if (sheetOn) {
    const n = MENU().length;
    if (a === 'up' || a === 'down') { sel = (sel + (a === 'up' ? -1 : 1) + n) % n; drawMenu(); play('move'); }
    else if (a === 'b' || a === 'menu') openSheet(false);
    else if (a === 'a') {
      const v = MENU()[sel][1];
      if (v === 'close') openSheet(false);
      else if (v === 'snd') { S.sound = !S.sound; keep(); drawMenu(); play('ok'); }
      else if (v === 'acc') { S.accent = (S.accent + 1) % ACC.length; keep(); paint(); drawMenu(); play('ok'); }
      else if (v === 'out') { await api.signOut(); location.reload(); }
      else api.power(v);
    }
    return;
  }
  const n = items().length, i = idx[tab];
  if (a === 'left' && i > 0) focus(i - 1);
  else if (a === 'right' && i < n - 1) focus(i + 1);
  else if (a === 'lb' || a === 'rb') { tab = tab === 'games' ? 'tv' : 'games'; play('tab'); render(); }
  else if (a === 'first') focus(0);
  else if (a === 'last') focus(n - 1);
  else if (a === 'a') go();
  else if (a === 'y' && tab === 'games') { if (await api.add()) load(); }
  else if (a === 'x' && items()[i].custom) { await api.remove(items()[i].id); load(); }
  else if (a === 'menu') openSheet(true);
}

// ---- controller + keyboard ----
const held = {};
const fire = (k, d, now, rep) => { if (!d) { held[k] = 0; return false; } if (!held[k]) { held[k] = now + (rep ? 380 : 1e12); return true; } if (rep && now >= held[k]) { held[k] = now + 120; return true; } return false; };
function poll(now) {
  const gp = [...navigator.getGamepads()].find(Boolean);
  $('#pad').classList.toggle('on', !!gp);
  if (gp) {
    const b = i => !!gp.buttons[i]?.pressed, [x, y] = gp.axes;
    const m = { left: b(14) || x < -.6, right: b(15) || x > .6, up: b(12) || y < -.6, down: b(13) || y > .6 };
    for (const k in m) if (fire(k, m[k], now, true)) act(k);
    const o = { a: b(0), b: b(1), x: b(2), y: b(3), lb: b(4), rb: b(5), menu: b(9) };
    for (const k in o) if (fire(k, o[k], now)) act(k);
  }
  requestAnimationFrame(poll);
}
addEventListener('keydown', e => {
  if (authOn) { if (e.key === 'Enter') submit(); return; }
  const m = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down', Enter: 'a', ' ': 'a', Escape: 'b', Backspace: 'b', x: 'x', Delete: 'x', y: 'y', m: 'menu', q: 'lb', e: 'rb', Tab: 'rb', PageUp: 'lb', PageDown: 'rb', Home: 'first', End: 'last' }[e.key];
  if (m) { e.preventDefault(); act(m); }
});

// ---- sign in + on-screen keyboard ----
const ROWS = [
  ['1','2','3','4','5','6','7','8','9','0','⌫'],
  ['q','w','e','r','t','y','u','i','o','p'],
  ['a','s','d','f','g','h','j','k','l','@'],
  ['⇧','z','x','c','v','b','n','m','.','_','-'],
  ['Switch field','Space','.com','Show'],
  ['SIGN IN','NEW ACCOUNT','GUEST'],
];
let kr = 1, kc = 0, shift = false, curField = 'em';
const field = () => $('#' + curField);
function authUI() { $('#at').textContent = createMode ? 'CREATE ACCOUNT' : 'SIGN IN'; $('#err').textContent = ''; drawOSK(); }
function showAuth() { authOn = true; $('#auth').classList.add('on'); authUI(); }
function drawOSK() {
  $('#osk').replaceChildren(...ROWS.map((row, r) => { const d = el('div', 'kr');
    row.forEach((k, c) => {
      const b = el('div', 'ok' + (k.length > 1 ? ' wd' : '') + (r === kr && c === kc ? ' on' : ''));
      b.textContent = k === 'NEW ACCOUNT' ? (createMode ? 'HAVE ACCOUNT' : 'NEW ACCOUNT') : (shift && k.length === 1 ? k.toUpperCase() : k);
      b.onclick = () => { kr = r; kc = c; press(); };
      d.append(b);
    }); return d; }));
  $('#em').classList.toggle('cur', curField === 'em'); $('#pw').classList.toggle('cur', curField === 'pw');
}
function press() {
  const k = ROWS[kr][kc], f = field();
  if (k === '⌫') f.value = f.value.slice(0, -1);
  else if (k === '⇧') shift = !shift;
  else if (k === 'Space') f.value += ' ';
  else if (k === '.com') f.value += '.com';
  else if (k === 'Switch field') curField = curField === 'em' ? 'pw' : 'em';
  else if (k === 'Show') $('#pw').type = $('#pw').type === 'password' ? 'text' : 'password';
  else if (k === 'SIGN IN') return submit();
  else if (k === 'NEW ACCOUNT') { createMode = !createMode; play('ok'); return authUI(); }
  else if (k === 'GUEST') return guestIn();
  else { f.value += shift ? k.toUpperCase() : k; shift = false; }
  play('move'); drawOSK();
}
function authAct(a) {
  if (a === 'up') kr = Math.max(0, kr - 1);
  else if (a === 'down') kr = Math.min(ROWS.length - 1, kr + 1);
  else if (a === 'left') kc = Math.max(0, kc - 1);
  else if (a === 'right') kc = Math.min(ROWS[kr].length - 1, kc + 1);
  else if (a === 'a') return press();
  else if (a === 'x') field().value = field().value.slice(0, -1);
  else if (a === 'y') field().value += ' ';
  else if (a === 'b') curField = curField === 'em' ? 'pw' : 'em';
  else if (a === 'menu') return submit();
  kc = Math.min(kc, ROWS[kr].length - 1); play('move'); drawOSK();
}
async function submit() {
  const r = await api.signIn($('#em').value.trim(), $('#pw').value, createMode);
  if (r.error) { $('#err').textContent = r.error; play('back'); return; }
  me = r.user; play('ok'); home();
}
async function guestIn() { await api.guest(); me = { guest: true, name: 'Player' }; play('ok'); home(); }
$('#em').onfocus = () => { curField = 'em'; drawOSK(); }; $('#pw').onfocus = () => { curField = 'pw'; drawOSK(); };

// ---- mouse ----
let mt, wt = 0;
addEventListener('mousemove', () => { document.body.classList.add('mouse'); clearTimeout(mt); mt = setTimeout(() => document.body.classList.remove('mouse'), 3000); });
$('#track').addEventListener('click', e => { const t = e.target.closest('.tile'); if (!t || authOn || locked || sheetOn) return; idx[tab] = [...$('#track').children].indexOf(t); focus(idx[tab], true); go(); });
$('#tabs').addEventListener('click', e => { const t = e.target.dataset.t; if (t && t !== tab && !locked && !sheetOn && !authOn) { tab = t; play('tab'); render(); } });
$('#menu').addEventListener('click', e => { const n = [...$('#menu').children].indexOf(e.target); if (n >= 0) { sel = n; act('a'); } });
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') openSheet(false); });
$('#hMenu').onclick = () => { if (!locked && !authOn) openSheet(!sheetOn); };
addEventListener('wheel', e => { const n = performance.now(); if (Math.abs(e.deltaY) > 20 && n - wt > 140 && !authOn) { wt = n; act(e.deltaY > 0 ? 'right' : 'left'); } }, { passive: true });

async function home(quiet) {
  authOn = false; $('#auth').classList.remove('on'); $('#who').textContent = me.name;
  await load(); locked = false;
  const h = new Date().getHours();
  $('#wh').textContent = `${h < 5 ? 'Still up' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'}, ${cap(me.name)}`;
  $('#wp').textContent = me.guest ? 'Welcome to Rensole R1' : 'Welcome back to Rensole R1';
  if (!quiet) { $('#welcome').classList.add('on'); play('welcome'); setTimeout(() => $('#welcome').classList.remove('on'), 4200); }
}
(async () => {
  paint(); const tick = () => $('#clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  tick(); setInterval(tick, 20000); requestAnimationFrame(poll);
  if (new URLSearchParams(location.search).has('resume')) {
    const r = JSON.parse(localStorage.getItem('r1resume') || '{}'); tab = r.tab || 'games'; Object.assign(idx, r.idx || {});
    mute = performance.now() + 800; $('#boot').remove(); me = (await api.authState()).user;
    if (me) home(true); else showAuth();
    return;
  }
  const st = api.authState(); play('boot'); await sleep(3400);
  $('#boot').classList.add('off'); const s = await st; me = s.user;
  if (me) home(); else showAuth();
})();
</script></body></html>
